name: ischolar

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ischolar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ischolar}
      POSTGRES_DB: ${POSTGRES_DB:-ischolar}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ischolar} -d ${POSTGRES_DB:-ischolar}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./services/backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ischolar:ischolar@postgres:5432/ischolar}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./services/backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ischolar:ischolar@postgres:5432/ischolar}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_DIR: ${STORAGE_DIR:-/data/storage}
    volumes:
      - storage:${STORAGE_DIR:-/data/storage}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ./services/backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ischolar:ischolar@postgres:5432/ischolar}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_DIR: ${STORAGE_DIR:-/data/storage}
    volumes:
      - storage:${STORAGE_DIR:-/data/storage}
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    env_file:
      - .env
    environment:
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql://ischolar:ischolar@postgres:5432/ischolar}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-dev-insecure-change-me}
      AUTH_SECRET: ${AUTH_SECRET:-dev-insecure-change-me}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      worker:
        condition: service_started
    ports:
      - "${WEB_PORT:-3000}:3000"

  proxy:
    image: caddy:2-alpine
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"

  eval:
    profiles: ["eval"]
    build:
      context: ./services/eval
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ischolar:ischolar@postgres:5432/ischolar}
    depends_on:
      postgres:
        condition: service_healthy

  # Optional: server-side embeddings backfill. Heavy (torch); enable with
  # `docker compose --profile vectors up -d`.
  vectors:
    profiles: ["vectors"]
    build:
      context: ./services/backend
      target: vectors
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ischolar:ischolar@postgres:5432/ischolar}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  storage:
