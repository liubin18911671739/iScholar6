name: ischolar

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ischolar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ischolar}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      # Use TCP (-h) so the check only passes after init scripts finish; the
      # bootstrap server is socket-only. Also wait for the auth `users` table.
      test:
        - "CMD-SHELL"
        - >-
          pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-ischolar} -d ${POSTGRES_DB:-ischolar}
          && psql -h 127.0.0.1 -U ${POSTGRES_USER:-ischolar} -d ${POSTGRES_DB:-ischolar}
          -tAc "SELECT to_regclass('public.users')" | grep -q users
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./services/backend
      target: vectors
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ischolar:ischolar@postgres:5432/ischolar}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./services/backend
      target: vectors
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ischolar:ischolar@postgres:5432/ischolar}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      HF_HOME: /data/hf
      ENVIRONMENT: ${ENVIRONMENT:-production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_DIR: ${STORAGE_DIR:-/data/storage}
    volumes:
      - storage:${STORAGE_DIR:-/data/storage}
      - hfcache:/data/hf
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ./services/backend
      target: vectors
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ischolar:ischolar@postgres:5432/ischolar}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      HF_HOME: /data/hf
      ENVIRONMENT: ${ENVIRONMENT:-production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_DIR: ${STORAGE_DIR:-/data/storage}
    volumes:
      - storage:${STORAGE_DIR:-/data/storage}
      - hfcache:/data/hf
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    env_file:
      - .env
    environment:
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql://ischolar:ischolar@postgres:5432/ischolar}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?AGENT_SERVICE_TOKEN is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-false}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      worker:
        condition: service_started
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"

  eval:
    profiles: ["eval"]
    build:
      context: ./services/eval
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ischolar:ischolar@postgres:5432/ischolar}
    depends_on:
      postgres:
        condition: service_healthy

  # Optional: server-side embeddings backfill. Heavy (torch); enable with
  # `docker compose --profile vectors up -d`.
  vectors:
    profiles: ["vectors"]
    build:
      context: ./services/backend
      target: vectors
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ischolar:ischolar@postgres:5432/ischolar}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      HF_HOME: /data/hf
    volumes:
      - hfcache:/data/hf
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  storage:
  hfcache:
